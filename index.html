:root{--ink:#15332d;--bg:#f5f5ef;--card:#fffefa;--line:#dce4dc;--accent:#ef7655;--ok:#249c68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.hero{background:var(--ink);color:#fff;display:flex;justify-content:space-between}.score{width:90px;height:90px;border:8px solid #a8d7c2;border-radius:50%;display:grid;place-content:center;text-align:center}.score b{font-size:1.5rem}nav{display:flex;gap:8px;overflow:auto;margin:16px 0}button{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}button.active{background:var(--accent)}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:span 2}.row,label{display:flex;gap:9px;align-items:center}.row{border-top:1px solid var(--line);padding:9px 0}.row span{flex:1}input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit;max-width:100%}form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}label{display:grid;align-items:stretch;font-size:.86rem}progress{width:100%;accent-color:var(--ok)}.goal.done{color:var(--ok)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{aspect-ratio:1;background:#edf1ec;color:var(--ink);display:grid;place-items:center;padding:3px}.day i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ink) var(--p),#dce4dc 0);font-style:normal}.day i small{background:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.chart{height:110px;display:flex;align-items:end;gap:3px;border-bottom:1px solid var(--line)}.chart i{background:var(--accent);flex:1;min-height:2px}.hint{color:#65756f <style>
:root{--ink:#18352f;--bg:#f3f6f2;--card:#fff;--line:#e2eae5;--accent:#287e69;--ok:#1d9b71}body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 90% 0%,#e3f1e8,transparent 36%),var(--bg);line-height:1.5}header,main,footer{max-width:1200px;padding-left:28px;padding-right:28px}header{padding-top:30px;padding-bottom:18px}header small{font-weight:700;letter-spacing:.15em;color:#6c8a7c;font-size:.65rem}h1{font-size:1.25rem;letter-spacing:-.04em;margin:5px 0}h2{letter-spacing:-.045em}h3{font-size:1.05rem;letter-spacing:-.025em;margin:0 0 18px}.hero,.card{border-radius:16px;box-shadow:0 10px 35px rgba(26,62,47,.055);border:1px solid #e3ebe6}.hero{padding:32px;background:linear-gradient(120deg,#173e35,#246454);box-shadow:0 18px 40px #184d3830}.hero small{color:#c8e7d7}.hero h2{font-size:clamp(1.6rem,3vw,2.2rem);margin:8px 0}.score{border-color:#87d7b2;background:#ffffff10}.card{padding:24px}.grid{gap:18px}nav{padding:6px;background:#e8eee9;border-radius:13px;width:max-content;max-width:100%;margin:22px 0}nav button{white-space:nowrap;background:transparent;color:#627b70;font-weight:600;padding:10px 16px}nav button.active{background:#fff;color:#1f6e59;box-shadow:0 2px 8px #1b483514}button{font:600 .86rem Inter,system-ui,sans-serif;background:#246f5a;padding:11px 16px;transition:transform .15s,background .15s}button:hover{background:#185843}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9bd8ba;outline-offset:2px}input,select,textarea{width:100%;border:1px solid #dce7df;background:#fafcf9;border-radius:10px;padding:12px;color:#18352f}label{color:#597367;font-weight:600;gap:7px}form{gap:14px}#bodyForm{grid-template-columns:1fr}#bodyForm button{width:100%}#base{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.goal{display:grid;grid-template-columns:1fr auto;gap:8px;background:#f7faf7;border:1px solid #e5eee7;padding:15px;border-radius:14px;color:#345a49}.goal input{grid-column:1/-1;background:white;font-size:1.15rem;font-weight:700}.goal progress{grid-column:1/-1;height:7px;border:0;border-radius:99px;overflow:hidden;accent-color:#2eaa7d}.goal small{grid-column:1/-1;color:#82958b;font-weight:500}.goal.done{background:#edf9f1;border-color:#b8e8ca}.row{padding:12px 0}.row input[type=checkbox]{width:19px;height:19px;accent-color:#2e9872}.day{border-radius:12px}.hint,footer{color:#72877c}@media(max-width:680px){header,main,footer{padding-left:16px;padding-right:16px}.hero{padding:22px}.card{padding:18px}#base{grid-template-columns:repeat(2,minmax(0,1fr))}nav button{padding:10px 12px}.score{width:76px;height:76px}}

</main><footer id="status">Nicht angemeldet</footer>
<script>
const url='https://fbloupbbyyfecgxognrt.supabase.co',key='sb_publishable_0Xj_1clgM-B81eFwtZrbxg_y_4VwuTL',sb=supabase.createClient(url,key),storage='health-dashboard-v5';let user,state={days:{},todos:[],reflection:''},current=new Date(),period=7;const $=x=>document.querySelector(x),iso=d=>d.toISOString().slice(0,10),plans=[['Mobility/Yoga','Wochenreflexion'],['Fitnessstudio','Mobility','Gleichgewicht'],['Zone 2','Koordination','Gedächtnis','Mobility'],['Fitnessstudio','Mobility','Rumpfstabilität'],['Zone 2','Mobility','Gedächtnis'],['Fitnessstudio','Griffkraft','Mobility'],['Koordination','Gedächtnis','Neue Fähigkeit']],supp=['Vitamin D','Zink','Omega 3','Magnesium'],goals={sleep:80,kcal:400,minutes:30,stand:10,steps:7000,water:2000};function day(k=iso(current)){return state.days[k]??={plan:{},base:{},body:{},supp:{},strength:[],cardio:[],food:[],sleep:{}}}function score(k){let d=day(k),total=plans[new Date(k).getDay()].length+supp.length+Object.keys(goals).length,done=Object.values(d.plan).filter(Boolean).length+Object.values(d.supp).filter(Boolean).length+Object.entries(goals).filter(([x,g])=>(+d.base[x]||0)>=g).length;return Math.round(done/total*100)}async function save(){localStorage.setItem(storage,JSON.stringify(state));if(user)await sb.from('dashboard_states').upsert({user_id:user.id,state,updated_at:new Date().toISOString()})}function render(){let k=iso(current),d=day(k),p=plans[current.getDay()];$('#date').textContent=current.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});$('#focus').textContent=current.toLocaleDateString('de-DE',{weekday:'long'});$('#score').textContent=score(k)+'%';$('#plan').innerHTML=p.map((x,i)=>`<label class="row"><input data-plan="${i}" type="checkbox" ${d.plan[i]?'checked':''}><span>${x}</span></label>`).join('');$('#base').innerHTML=Object.entries(goals).map(([x,g])=>`<label class="goal ${(+d.base[x]||0)>=g?'done':''}">${x==='water'?'Wasser (ml)':x}<input data-base="${x}" type="number" value="${d.base[x]||''}" placeholder="Ziel ${g}"><progress value="${Math.min(+d.base[x]||0,g)}" max="${g}"></progress><small>${d.base[x]||0}/${g}</small></label>`).join('');$('#supplements').innerHTML=supp.map((x,i)=>`<label class="row"><input data-supp="${i}" type="checkbox" ${d.supp[i]?'checked':''}><span>${x}</span></label>`).join('');$('#strength').innerHTML=d.strength.map((x,i)=>`<div class="row"><span>${x.exercise}: ${x.sets}×${x.reps}×${x.weight} kg</span><button data-del-strength="${i}">Löschen</button></div>`).join('');$('#volume').textContent='Volumen '+d.strength.reduce((a,x)=>a+x.sets*x.reps*x.weight,0)+' kg';$('#food').innerHTML=d.food.map(x=>`<div class="row">${x.meal}: ${x.kcal} kcal · ${x.protein} g</div>`).join('');renderCalendar();renderTrends();$('#todos').innerHTML=state.todos.filter(x=>!x.done).map(x=>`<label class="row"><input data-todo="${x.id}" type="checkbox"><span>${x.text}</span><button data-del-todo="${x.id}">×</button></label>`).join('')}
function renderCalendar(){let n=new Date(current.getFullYear(),current.getMonth()+1,0).getDate(),t=iso(new Date());$('#calendarGrid').innerHTML=Array.from({length:n},(_,i)=>{let d=new Date(current.getFullYear(),current.getMonth(),i+1),k=iso(d),v=score(k);return `<button class="day" data-day="${k}" ${k>t?'disabled':''}>${i+1}<i style="--p:${v*3.6}deg"><small>${v}</small></i></button>`}).join('')}function renderTrends(){let keys=Array.from({length:period},(_,i)=>{let x=new Date();x.setDate(x.getDate()-period+1+i);return iso(x)}),items=[['Schritte',d=>d.base.steps],['Wasser ml',d=>d.base.water],['HRV',d=>d.body.hrv],['Ruhepuls',d=>d.body.rhr],['VO₂max',d=>d.cardio.at(-1)?.vo2]];$('#trendsGrid').innerHTML=items.map(([n,get])=>{let a=keys.map(k=>+get(day(k))||0),m=Math.max(...a,1);return `<article class="card"><h4>${n}</h4><div class="chart">${a.map(v=>`<i style="height:${v/m*100}%"></i>`).join('')}</div></article>`}).join('')}
document.addEventListener('change',async e=>{let d=day(),q=e.target.dataset;if(q.plan!==undefined)d.plan[q.plan]=e.target.checked;if(q.supp!==undefined)d.supp[q.supp]=e.target.checked;if(q.base)d.base[q.base]=+e.target.value;if(q.todo)state.todos.find(x=>x.id===q.todo).done=true;await save();render()});document.addEventListener('click',async e=>{let q=e.target.dataset,d=day();if(q.day){current=new Date(q.day+'T12:00:00');render()}if(q.delStrength!==undefined)d.strength.splice(q.delStrength,1);if(q.delTodo)state.todos=state.todos.filter(x=>x.id!==q.delTodo);if(q.delStrength!==undefined||q.delTodo){await save();render()}});function form(id,fn){$(id).onsubmit=async e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target)));e.target.reset();await save();render()}}form('#bodyForm',x=>day().body=x);form('#strengthForm',x=>{x.sets=+x.sets;x.reps=+x.reps;x.weight=+x.weight;day().strength.push(x)});form('#cardioForm',x=>day().cardio.push(x));form('#foodForm',x=>day().food.push(x));form('#sleepForm',x=>day().sleep=x);form('#todoForm',x=>state.todos.push({id:crypto.randomUUID(),text:x.text,done:false}));$('#reflectionSave').onclick=async()=>{state.reflection=$('#reflection').value;await save()};$('#archiveToggle').onclick=()=>{let a=$('#archive');a.hidden=!a.hidden;a.innerHTML=state.todos.filter(x=>x.done).map(x=>`<div>${x.text}</div>`).join('')};$('#period').onclick=()=>{period=period===7?30:7;$('#period').textContent=period===7?'Monat':'Woche';renderTrends()};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view,#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')});['today','calendar','training','health','trends','notes'].forEach(x=>$('#nav').insertAdjacentHTML('beforeend',`<button data-view="${x}" class="${x==='today'?'active':''}">${{today:'Heute',calendar:'Kalender',training:'Training',health:'Gesundheit',trends:'Trends',notes:'Notizen'}[x]}</button>`));(async()=>{let {data:{session}}=await sb.auth.getSession();if(session){user=session.user;let {data}=await sb.from('dashboard_states').select('state').eq('user_id',user.id).maybeSingle();if(data?.state)state=data.state;$('#auth').innerHTML='<button id="logout">Abmelden</button>';$('#logout').onclick=()=>sb.auth.signOut().then(()=>location.reload())}else $('#auth').innerHTML='<form id="login"><input name="email" type="email" placeholder="E-Mail"><input name="password" type="password" placeholder="Passwort"><button>Anmelden</button><button type="button" id="signup">Konto erstellen</button></form>';$('#login')?.addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),r=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(r.error)alert(r.error.message);else location.reload()});$('#signup')?.addEventListener('click',async()=>{let f=new FormData($('#login')),r=await sb.auth.signUp({email:f.get('email'),password:f.get('password')});alert(r.error?.message||'Bitte E-Mail bestätigen.')});render()})();

document.querySelector('#nav').addEventListener('click', function (event) {
  const button = event.target.closest('button[data-view]');
  if (!button) return;
  const view = document.getElementById(button.dataset.view);
  if (!view) return;
  document.querySelectorAll('.view, #nav button').forEach(el => el.classList.remove('active'));
  button.classList.add('active');
  view.classList.add('active');
});
</script><script>
// Formularentwürfe gehören zum ausgewählten Tag. Sie bleiben auch bei einem
// fehlgeschlagenen Speicherversuch erhalten; der Tagwechsel wird dann abgebrochen.
const draftForms=['bodyForm','sleepForm','strengthForm','cardioForm','foodForm'];
let switchingDay=false;
function captureDayDraft() {
  const record=day(); record.drafts ||= {};
  for(const id of draftForms) {
    const form=document.getElementById(id);
    record.drafts[id]=Object.fromEntries(new FormData(form));
  }
  for(const input of document.querySelectorAll('[data-base]')) {
    if(input.value!=='') record.base[input.dataset.base]=Number(input.value);
  }
}
function populateDayForms() {
  const record=day();
  for(const id of draftForms) {
    const form=document.getElementById(id);
    form.reset();
    const values=record.drafts?.[id] || (id==='bodyForm'?record.body:id==='sleepForm'?record.sleep:{});
    for(const [name,value] of Object.entries(values||{})) {
      const field=form.elements.namedItem(name); if(field) field.value=value ?? '';
    }
  }
}
document.addEventListener('click',async event=>{
  const button=event.target.closest('[data-day]');
  if(!button||button.disabled)return;
  event.preventDefault(); event.stopImmediatePropagation();
  if(switchingDay)return;
  if(!user){alert('Bitte melde dich an, bevor du den Tag wechselst.');return;}
  switchingDay=true; button.disabled=true;
  try {
    captureDayDraft();
    const snapshot=structuredClone(state);
    const {error:writeError}=await sb.from('dashboard_states').upsert({user_id:user.id,state:snapshot,updated_at:new Date().toISOString()});
    if(writeError)throw writeError;
    const {data,error:readError}=await sb.from('dashboard_states').select('state').eq('user_id',user.id).single();
    if(readError)throw readError;
    if(!data?.state?.days)throw new Error('Die gespeicherten Tagesdaten konnten nicht gelesen werden.');
    state=data.state;
    current=new Date(button.dataset.day+'T12:00:00');
    render(); populateDayForms();
    document.querySelector('#status').textContent='Gespeichert · '+current.toLocaleDateString('de-DE');
  } catch(error) {
    document.querySelector('#status').textContent='Speichern fehlgeschlagen';
    alert('Der Tag wurde nicht gewechselt. Deine Eingaben bleiben stehen. Bitte Verbindung und Anmeldung prüfen.');
    console.error(error);
  } finally {switchingDay=false;button.disabled=false;}
},true);
// Beim ersten Öffnen ebenfalls bereits gespeicherte Felder zeigen.
window.addEventListener('load',()=>setTimeout(populateDayForms,500));
</script></body></html>
